# Release build. The release workflow runs it on a v* tag.
# Rehearse locally with: goreleaser release --snapshot --clean
version: 2

project_name: yadm

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: yadm
    main: ./cmd/yadm
    binary: yadm
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
  - id: yadm-oracle
    main: ./cmd/yadm-oracle
    binary: yadm-oracle
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  draft: false
  prerelease: auto
