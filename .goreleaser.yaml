# Release build. The release workflow runs it on a v* tag, on a macOS runner.
# Rehearse locally with: goreleaser release --snapshot --clean
#
# Each darwin binary is signed by scripts/macos-sign.sh as it is built, so the
# archives and checksums.txt hold the signed files. The identifiers below are
# permanent: macOS ties launch constraints and privacy grants to them.
# The release is created as a draft; the workflow notarizes the darwin
# binaries, attaches a .sha256 beside each darwin archive, then publishes it.
version: 2

project_name: yadm

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: yadm
    main: ./cmd/yadm
    binary: yadm
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    hooks:
      post:
        - cmd: ./scripts/macos-sign.sh {{ .Os }} {{ .Path }} com.nkmkdigital.yadm
          output: true
  - id: yadm-oracle
    main: ./cmd/yadm-oracle
    binary: yadm-oracle
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
    hooks:
      post:
        - cmd: ./scripts/macos-sign.sh {{ .Os }} {{ .Path }} com.nkmkdigital.yadm.oracle
          output: true

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  draft: true
  replace_existing_draft: true
  prerelease: auto
